<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EBNE Coordinación</title>
<link rel="icon" href="logo.png">
<style>
  :root{
    --rojo:#c8202f; --azul:#1f6fb2; --azul-osc:#0f4c81; --bg:#f4f6f9; --card:#fff;
    --txt:#1b2733; --sub:#5b6b7b; --borde:#dbe2ea; --ok:#1e8e4e; --warn:#c77700; --bad:#c8202f;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#10161d; --card:#18212b; --txt:#e8eef4; --sub:#9bacbc; --borde:#2a3643; --ok:#43b878; --warn:#e0a03a; --bad:#ff6b78; }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);}
  header{background:var(--azul-osc);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;position:sticky;top:0;z-index:5}
  header img{height:40px;background:#fff;border-radius:8px;padding:2px}
  header h1{font-size:1.05rem;margin:0;flex:1}
  header .who{font-size:.8rem;opacity:.9;text-align:right}
  header button{background:transparent;border:1px solid #ffffff88;color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
  main{max-width:980px;margin:0 auto;padding:16px}
  .inicio{max-width:380px;margin:5vh auto;text-align:center;padding:0 8px}
  .inicio img{width:min(240px,70vw);margin-bottom:18px}
  .puertas{display:flex;flex-direction:column;gap:12px;margin-top:10px}
  .puerta{background:var(--azul-osc);color:#fff;border:0;border-radius:14px;padding:18px;font-size:1.1rem;font-weight:600;cursor:pointer}
  .puerta:last-child{background:var(--rojo)}
  code{background:#8882;border-radius:6px;padding:2px 6px;letter-spacing:.05em}
  .login{max-width:380px;margin:12vh auto;text-align:center;background:var(--card);border:1px solid var(--borde);border-radius:16px;padding:28px 22px}
  .login img{width:170px}
  .login h2{margin:.4rem 0 .2rem}
  .login p{color:var(--sub);margin:.2rem 0 1.2rem}
  button.primary{background:var(--rojo);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;font-size:.95rem}
  button.ghost{background:transparent;color:var(--azul);border:1px solid var(--borde);border-radius:10px;padding:8px 12px;cursor:pointer}
  button.small{padding:5px 9px;font-size:.82rem;border-radius:8px}
  button.danger{color:var(--bad)}
  button:disabled{opacity:.5;cursor:default}
  nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  nav.tabs button{background:var(--card);border:1px solid var(--borde);border-radius:999px;padding:8px 14px;cursor:pointer;color:var(--txt)}
  nav.tabs button.on{background:var(--azul);border-color:var(--azul);color:#fff}
  .card{background:var(--card);border:1px solid var(--borde);border-radius:14px;padding:14px;margin-bottom:12px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .row.sp{justify-content:space-between}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--borde);vertical-align:top}
  th{color:var(--sub);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em}
  .tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.75rem;background:#1f6fb21f;color:var(--azul);margin:1px 2px 1px 0}
  .tag.off{background:#8881;color:var(--sub)}
  .tag.ok{background:#1e8e4e22;color:var(--ok)}
  .tag.pend{background:#8882;color:var(--sub)}
  .tag.warn{background:#c7770026;color:var(--warn)}
  .tag.bad{background:#c8202f22;color:var(--bad)}
  .tag.info{background:#1f6fb22a;color:var(--azul)}
  input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--borde);border-radius:10px;padding:9px 10px;min-width:0}
  textarea{width:100%;resize:vertical}
  label{display:block;font-size:.8rem;color:var(--sub);margin:10px 0 4px}
  .modal-bg{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:10}
  .modal{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:520px;border:1px solid var(--borde)}
  .modal h3{margin:0 0 4px}
  .asig{display:flex;gap:6px;margin-bottom:6px}
  .asig select{flex:1}
  .msg{padding:10px 12px;border-radius:10px;background:#c7770018;color:var(--txt);margin-bottom:12px;font-size:.9rem}
  .msg.bad{background:#c8202f18}
  .empty{color:var(--sub);text-align:center;padding:22px}
  .muted{color:var(--sub);font-size:.85rem}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .chip{border:1px solid var(--borde);background:var(--card);border-radius:12px;padding:8px 12px;cursor:pointer;text-align:left;color:var(--txt);min-width:96px}
  .chip b{display:block;font-size:1.3rem}
  .chip span{font-size:.75rem;color:var(--sub)}
  .chip.on{border-color:var(--azul);box-shadow:0 0 0 2px #1f6fb244}
  .mes{margin:16px 0 6px;text-transform:capitalize;font-size:.95rem;color:var(--sub)}
  .ev{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--borde)}
  .ev.pasado{opacity:.55}
  .ev .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
  .ev .fecha{width:92px;flex:none;font-size:.85rem;text-transform:capitalize}
  .ev .cuerpo{flex:1;min-width:0}
  a{color:var(--azul)}
  @media (max-width:640px){ table.hide3 th:nth-child(3), table.hide3 td:nth-child(3){display:none} .ev .fecha{width:78px} }
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="EPSA">
  <h1>EBNE Coordinación</h1>
  <div class="who" id="who"></div>
  <button id="btnSalir" hidden>Salir</button>
</header>
<main id="app"><div class="empty">Cargando…</div></main>

<script type="module">
import { firebaseConfig } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInAnonymously, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, writeBatch, query, orderBy, where }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const ADMIN_ORIGEN = "cocojleguizamon@gmail.com";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ---------- Datos iniciales ----------
const SEDES_INICIALES = ["Córdoba", "Ballester", "CABA"];
const MATERIAS_INICIALES = [
  ["Natación", "Prácticas y condición física"],
  ["Preparación Física", "Prácticas y condición física"],
  ["Técnicas y Estrategias de Salvamento", "Prácticas y condición física"],
  ["Anatomía y Fisiología del Cuerpo Humano", "Ciencias aplicadas a la salud"],
  ["Educación Sanitaria", "Ciencias aplicadas a la salud"],
  ["Primeros Auxilios y Técnicas Sanitarias Específicas", "Ciencias aplicadas a la salud"],
  ["Reanimación Cardiopulmonar (RCP)", "Ciencias aplicadas a la salud"],
  ["Aspectos Psicosociales, Éticos y Legales de la Profesión", "Fundamento teórico profesional"],
  ["Problemática del Ahogamiento", "Fundamento teórico profesional"],
  ["Entornos Acuáticos", "Fundamento teórico profesional"],
];
const TIPOS = {
  inicio_cuatrimestre: ["Inicio de cuatrimestre", "#1e8e4e"],
  cierre_cuatrimestre: ["Cierre de cuatrimestre", "#0f4c81"],
  vencimiento_programa: ["Vencimiento de programa", "#c8202f"],
  cierre_notas: ["Cierre de notas del mes", "#c77700"],
  testeo: ["Testeo", "#7b3fb0"],
  parcial: ["Parcial / examen", "#1f6fb2"],
  feriado: ["Feriado / sin clases", "#7a8794"],
  otro: ["Otro", "#4b5b6b"],
};
// Niveles: full (edita todo), lector (solo mira el seguimiento), conta (presentismo docente), docente.
const AREAS = {
  gestion: ["Gestión EBNE", "full"],
  administracion: ["Administración EBNE", "conta"],
  coordinacion: ["Coordinación-Rectoría EBNE", "full"],
  secretaria: ["Secretaría EBNE", "lector"],
};
const TABS = {
  full: [["cumplimiento","Seguimiento"],["libros","Libros de temas"],["calendario","Calendario"],["catedras","Cátedras"],["equipo","Accesos"],["sedes","Sedes"],["materias","Materias"]],
  lector: [["cumplimiento","Seguimiento"],["libros","Libros de temas"],["calendario","Calendario"]],
  conta: [["presentismo","Presentismo docente"],["calendario","Calendario"]],
  docente: [["mis","Mis tareas"],["libro","Libro de temas"],["calendario","Calendario"]],
};

// ---------- Utilidades ----------
const pad = n => String(n).padStart(2, "0");
const slug = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = (s, r=document) => r.querySelector(s);
const hoy = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const fechaObj = f => new Date(f + "T12:00:00");
const diffDias = (a, b) => Math.round((fechaObj(b) - fechaObj(a)) / 864e5);
const fmtCorta = f => fechaObj(f).toLocaleDateString("es-AR", { day: "numeric", month: "short" });
const fmtLarga = f => fechaObj(f).toLocaleDateString("es-AR", { weekday: "short", day: "numeric", month: "short" });
const urlOk = u => /^https?:\/\//i.test(u || "");
const mailOk = m => /^\S+@\S+\.\S+$/.test(m);
const pid = (sedeId, materiaId) => `${sedeId}__${materiaId}`;
const rolDe = u => (u?.rol === "admin" || u?.rol === "coordinador") ? "admin" : "docente";
function addMes(f, n) {
  const [y, m, d] = f.split("-").map(Number);
  const t = new Date(y, m - 1 + n, 1);
  const ult = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(Math.min(d, ult))}`;
}
function nuevaClave() {
  const c = "ABCDEFGHJKMNPQRSTUVWXYZ23456789", a = new Uint32Array(6);
  crypto.getRandomValues(a);
  return [...a].map(n => c[n % c.length]).join("");
}

// ---------- Estado ----------
let me = null;          // propietario (cuenta de Google)
let area = null;        // área EBNE que ingresó con clave
let docSes = null;      // equipo docente: { sedeId, materiaId } (entra con la clave de la cátedra)
let preview = null;     // administración mirando la pantalla de una cátedra (solo lectura)
let entrando = false;
let sedes = [], materias = [], usuarios = [], calendario = [], programas = [], catedras = [], areas = [], libros = [], horarios = [];
let tab = "mis";
let filtro = { sede: "" };
let fcal = { sede: "", tipo: "", pasados: false };
let fcum = { sede: "", estado: "" };
const catActual = () => preview || docSes;
const nivel = () => catActual() ? "docente" : me ? "full" : area ? AREAS[area][1] : "docente";
const canEdit = () => nivel() === "full";
const actor = () => me?.id || (area ? "area:" + area : "");
const combosActivos = () => sedes.filter(s => s.activa !== false)
  .flatMap(s => materias.filter(m => m.activa !== false).map(m => ({ sedeId: s.id, materiaId: m.id })));

const app$ = $("#app");
const setHeader = on => { $("header").style.display = on ? "flex" : "none"; };
$("#btnSalir").onclick = async () => {
  if (auth.currentUser?.isAnonymous) { try { await deleteDoc(doc(db, "sesiones", auth.currentUser.uid)); } catch {} }
  preview = null;
  await signOut(auth);
};
async function cerrarYMostrar(fn) {
  entrando = true;
  try { await signOut(auth); } catch {}
  me = null; docSes = null; area = null; preview = null;
  fn();
  setTimeout(() => { entrando = false; }, 700);
}

onAuthStateChanged(auth, async (u) => {
  if (entrando) return;
  if (!u) { me = null; docSes = null; area = null; preview = null; return pantallaInicio(); }
  try { u.isAnonymous ? await cargarSesionAnon(u) : await cargarSesion(u); }
  catch (e) { console.error(e); pantallaError(e); }
});

// ---------- Pantalla de ingreso única ----------
async function pantallaInicio(msg) {
  setHeader(false); $("#who").textContent = ""; $("#btnSalir").hidden = true;
  if (!sedes.length || !materias.length) {
    app$.innerHTML = `<div class="empty">Cargando…</div>`;
    try {
      const [s, m] = await Promise.all([
        getDocs(query(collection(db, "sedes"), orderBy("orden"))),
        getDocs(query(collection(db, "materias"), orderBy("orden"))),
      ]);
      sedes = s.docs.map(d => ({ id: d.id, ...d.data() }));
      materias = m.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch (e) { console.error(e); }
  }
  const ss = sedes.filter(s => s.activa !== false), mm = materias.filter(m => m.activa !== false);
  app$.innerHTML = `
    <div class="inicio">
      <img src="logo.png" alt="EBNE">
      <h2 style="margin:.2rem 0 14px">Bienvenido al Management App EBNE</h2>
      ${msg ? `<div class="msg bad">${esc(msg)}</div>` : ""}
      <div style="text-align:left">
        <label>¿Quién ingresa?</label>
        <select id="sel" style="width:100%">
          <option value="">Elegir…</option>
          ${ss.map(s => `<optgroup label="Materia · ${esc(s.nombre)}">${mm.map(m => `<option value="doc|${esc(s.id)}|${esc(m.id)}">${esc(m.nombre)}</option>`).join("")}</optgroup>`).join("")}
          <optgroup label="Equipo EBNE">${Object.entries(AREAS).map(([k,[n]]) => `<option value="area|${k}">${esc(n)}</option>`).join("")}</optgroup>
        </select>
        <label>Clave</label>
        <input id="dc" type="password" autocomplete="off" style="width:100%" placeholder="Clave">
      </div>
      <p><button class="primary" id="ing" style="width:100%">Ingresar</button></p>
      <p><button class="ghost small" id="goog">Acceso del propietario (Google)</button></p>
    </div>`;
  $("#goog").onclick = async () => {
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch (e) { pantallaInicio("No se pudo iniciar sesión: " + (e.code || e.message)); }
  };
  const entrar = async () => {
    const [tipo, a, b] = ($("#sel").value || "").split("|"), clave = $("#dc").value.trim();
    if (!tipo || !clave) return pantallaInicio("Elegí quién ingresa y escribí la clave.");
    const datos = tipo === "area" ? { area: a, clave } : { sedeId: a, materiaId: b, clave };
    $("#ing").disabled = true; entrando = true;
    try {
      const cred = await signInAnonymously(auth);
      await setDoc(doc(db, "sesiones", cred.user.uid), { ...datos, creada: new Date().toISOString() });
      entrando = false;
      await cargarSesionAnon(cred.user);
    } catch (e) {
      console.error(e);
      await cerrarYMostrar(() => pantallaInicio(e.code === "permission-denied"
        ? "La clave no es correcta para esa opción."
        : "No se pudo ingresar: " + (e.code || e.message)));
    }
  };
  $("#ing").onclick = entrar;
  $("#dc").onkeydown = e => { if (e.key === "Enter") entrar(); };
}

function pantallaError(e) {
  setHeader(true);
  app$.innerHTML = `<div class="card"><div class="msg bad">Ocurrió un error: ${esc(e.code || e.message)}</div>
  <button class="ghost" onclick="location.reload()">Reintentar</button></div>`;
}

async function cargarSesion(u) {   // propietario con Google
  const email = u.email.toLowerCase();
  const snap = await getDoc(doc(db, "usuarios", email));
  me = snap.exists() ? { id: email, ...snap.data() } : null;
  if (!me && email === ADMIN_ORIGEN) me = { id: email, email, nombre: u.displayName || "Administrador", rol: "admin", activo: true };
  if (!me || me.activo === false || rolDe(me) !== "admin") {
    return cerrarYMostrar(() => pantallaInicio("Tu mail (" + email + ") no está habilitado."));
  }
  docSes = null; area = null; preview = null;
  setHeader(true);
  $("#who").innerHTML = `${esc(me.nombre || email)}<br>Propietario`;
  $("#btnSalir").hidden = false;
  tab = TABS.full[0][0];
  await cargarDatos();
  vista();
}

async function cargarSesionAnon(u) {   // ingreso por clave: cátedra o área
  const s = await getDoc(doc(db, "sesiones", u.uid));
  if (!s.exists()) return cerrarYMostrar(() => pantallaInicio());
  me = null; preview = null;
  const d = s.data();
  if (d.area && AREAS[d.area]) { area = d.area; docSes = null; }
  else { area = null; docSes = { sedeId: d.sedeId, materiaId: d.materiaId }; }
  try { await cargarDatos(); }
  catch (e) {
    if (e.code === "permission-denied")
      return cerrarYMostrar(() => pantallaInicio("La clave cambió. Ingresá de nuevo."));
    throw e;
  }
  setHeader(true);
  $("#who").innerHTML = area ? `${esc(AREAS[area][0])}` : `${esc(nMat(docSes.materiaId))}<br>${esc(nSede(docSes.sedeId))}`;
  $("#btnSalir").hidden = false;
  tab = TABS[nivel()][0][0];
  vista();
}

async function cargarDatos() {
  const nv = nivel();
  const [s, m, c] = await Promise.all([
    getDocs(query(collection(db, "sedes"), orderBy("orden"))),
    getDocs(query(collection(db, "materias"), orderBy("orden"))),
    getDocs(query(collection(db, "calendario"), orderBy("fecha"))),
  ]);
  sedes = s.docs.map(d => ({ id: d.id, ...d.data() }));
  materias = m.docs.map(d => ({ id: d.id, ...d.data() }));
  calendario = c.docs.map(d => ({ id: d.id, ...d.data() }));
  if (docSes) {
    const p = await getDoc(doc(db, "programas", pid(docSes.sedeId, docSes.materiaId)));
    programas = p.exists() ? [{ id: p.id, ...p.data() }] : [];
    const [lb, hr] = await Promise.all([
      getDocs(query(collection(db, "libros"), where("sedeId", "==", docSes.sedeId), where("materiaId", "==", docSes.materiaId))),
      getDoc(doc(db, "horarios", pid(docSes.sedeId, docSes.materiaId))),
    ]);
    libros = lb.docs.map(d => ({ id: d.id, ...d.data() }));
    horarios = hr.exists() ? [{ id: hr.id, ...hr.data() }] : [];
  } else if (nv === "full") {
    const [us, pr, ca, ar, lb, hr] = await Promise.all([
      getDocs(collection(db, "usuarios")), getDocs(collection(db, "programas")),
      getDocs(collection(db, "catedras")), getDocs(collection(db, "areas")),
      getDocs(collection(db, "libros")), getDocs(collection(db, "horarios")),
    ]);
    libros = lb.docs.map(d => ({ id: d.id, ...d.data() }));
    horarios = hr.docs.map(d => ({ id: d.id, ...d.data() }));
    usuarios = us.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (a.nombre||"").localeCompare(b.nombre||""));
    programas = pr.docs.map(d => ({ id: d.id, ...d.data() }));
    catedras = ca.docs.map(d => ({ id: d.id, ...d.data() }));
    areas = ar.docs.map(d => ({ id: d.id, ...d.data() }));
  } else if (nv === "lector") {
    const [pr, lb, hr] = await Promise.all([getDocs(collection(db, "programas")), getDocs(collection(db, "libros")), getDocs(collection(db, "horarios"))]);
    programas = pr.docs.map(d => ({ id: d.id, ...d.data() }));
    libros = lb.docs.map(d => ({ id: d.id, ...d.data() }));
    horarios = hr.docs.map(d => ({ id: d.id, ...d.data() }));
    catedras = [];
  } else if (nv === "conta") {
    const [lb, hr] = await Promise.all([getDocs(collection(db, "libros")), getDocs(collection(db, "horarios"))]);
    libros = lb.docs.map(d => ({ id: d.id, ...d.data() }));
    horarios = hr.docs.map(d => ({ id: d.id, ...d.data() }));
  }
}
const nSede = id => id === "todas" ? "Todas las sedes" : (sedes.find(s => s.id === id)?.nombre ?? id);
const nMat = id => materias.find(m => m.id === id)?.nombre ?? id;

// ---------- Estructura general ----------
function vista() {
  const rol = nivel();
  if (!TABS[rol].some(t => t[0] === tab)) tab = TABS[rol][0][0];
  const vacio = rol === "full" && (!sedes.length || !materias.length);
  const combos = combosActivos();
  app$.innerHTML = `
    ${preview ? `<div class="msg row sp"><span>Estás viendo la pantalla del equipo docente de <b>${esc(nMat(preview.materiaId))} · ${esc(nSede(preview.sedeId))}</b> (solo lectura).</span>
      <button class="ghost small" id="salirPrev">Volver a gestión</button></div>` : ""}
    ${rol === "full" && !preview && combos.length ? `<div class="row" style="margin-bottom:10px"><span class="muted">Ver como equipo docente:</span>
      <select id="prev"><option value="">Elegir cátedra…</option>${combos.map(c => `<option value="${esc(c.sedeId)}|${esc(c.materiaId)}">${esc(nSede(c.sedeId))} · ${esc(nMat(c.materiaId))}</option>`).join("")}</select></div>` : ""}
    ${vacio ? `<div class="msg row sp"><span>Todavía no hay sedes o materias cargadas.</span>
      <button class="primary" id="seed">Cargar sedes y materias iniciales</button></div>` : ""}
    <nav class="tabs">

     sedes: panelSedes, materias: panelMaterias, mis: panelMis })[tab]();

function abrirModal(html) {
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(bg);
  return bg;
}

async function cargarIniciales() {
  const b = writeBatch(db);
  if (!sedes.length) SEDES_INICIALES.forEach((n,i) => b.set(doc(db,"sedes",slug(n)), { nombre:n, activa:true, orden:i }));
  if (!materias.length) MATERIAS_INICIALES.forEach(([n,a],i) => b.set(doc(db,"materias",slug(n)), { nombre:n, area:a, activa:true, orden:i }));
  await b.commit(); await cargarDatos(); vista();
}

// ---------- Programas: fechas límite y estados ----------
function vencimientoDe(sedeId) {
  const l = calendario
    .filter(e => e.tipo === "vencimiento_programa" && (e.sedeId === "todas" || e.sedeId === sedeId))
    .sort((a,b) => a.fecha.localeCompare(b.fecha));
  return l.find(e => e.fecha >= hoy()) || l[l.length - 1] || null;
}
function claveEstado(p, dl) {
  if (p?.estado === "aprobado") return "aprobado";
  if (p?.estado === "cargado") return "cargado";
  if (p?.estado === "devuelto") return "devuelto";
  if (!dl) return "pendiente";
  const d = diffDias(hoy(), dl.fecha);
  return d < 0 ? "atrasado" : d <= 7 ? "porvencer" : "pendiente";
}
function etiqueta(k, dl) {
  const d = dl ? diffDias(hoy(), dl.fecha) : null;
  switch (k) {
    case "aprobado": return ["ok", "Aprobado"];
    case "cargado": return ["info", "Para revisar"];
    case "devuelto": return ["warn", "Devuelto"];
    case "atrasado": return ["bad", `Atrasado ${-d} d`];
    case "porvencer": return ["warn", d === 0 ? "Vence hoy" : `Vence en ${d} d`];
    default: return ["pend", dl ? `Pendiente · vence ${fmtCorta(dl.fecha)}` : "Pendiente · sin fecha límite"];
  }
}
const tag = (k, dl) => { const [c, t] = etiqueta(k, dl); return `<span class="tag ${c}">${esc(t)}</span>`; };
const enlace = (u, t) => urlOk(u) ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>` : "";
const ORDEN_K = { atrasado: 0, devuelto: 1, porvencer: 2, cargado: 3, pendiente: 4, aprobado: 5 };

// ---------- Equipo docente: Mis tareas ----------
function panelMis() {
  const cat = catActual();

  const pendiente = ["atrasado","devuelto","porvencer","pendiente"].includes(k);
  const urgente = k === "atrasado" || k === "devuelto";
  const h = hoy();
  const prox = calendario.filter(e => (e.fechaFin || e.fecha) >= h && (e.sedeId === "todas" || e.sedeId === cat.sedeId)).slice(0, 3);
  const btn = k === "aprobado" ? "" :
    `<button class="${pendiente ? "primary" : "ghost"} small" id="cargarProg">${p ? "Actualizar programa" : "Cargar programa"}</button>`;
  const tarea = `
    <div class="card" style="${pendiente ? `border-left:4px solid ${k==="atrasado"?"var(--bad)":k==="pendiente"?"var(--borde)":"var(--warn)"}` : ""}">
      <div class="row sp">
        <div><strong>${pendiente ? "Cargar el programa de la materia" : "Programa de la materia"}</strong><br><span class="muted">${esc(nMat(cat.materiaId))} · ${esc(nSede(cat.sedeId))}</span></div>
        <div>${tag(k, dl)}</div>
      </div>
      ${k === "devuelto" && p?.comentario ? `<div class="msg" style="margin-top:10px"><b>Coordinación te pidió corregir:</b> ${esc(p.comentario)}</div>` : ""}
      ${p?.cargadoPor ? `<div class="muted" style="margin-top:8px">Cargado por ${esc(p.cargadoPor)}</div>` : ""}
      <div class="row" style="margin-top:10px">${btn} ${p?.link ? enlace(p.link, "Ver lo cargado") : ""}</div>
    </div>`;
  const lbe = libroEstado(cat.sedeId, cat.materiaId);
  const tareasLibro = lbe.atrasadas.sort((a,b) => a.fecha.localeCompare(b.fecha)).map(c => `
    <div class="card" style="border-left:4px solid var(--bad)">
      <div class="row sp"><div><strong>Completar el libro de temas</strong><br><span class="muted">Clase del ${esc(fmtClase(c))}</span></div>
        <span class="tag bad">No completaste el libro de temas</span></div>
      <div class="row" style="margin-top:10px"><button class="primary small" data-lb="${esc(c.fecha)}|${esc(c.ini)}|${esc(c.fin)}">Completar ahora</button></div>
    </div>`).join("");
  const hoyLibro = lbe.deHoy.map(c => `
    <div class="card"><div class="row sp"><div><strong>Clase de hoy</strong><br><span class="muted">${esc(fmtClase(c))} · cargá el libro de temas antes de las ${String(c.limite.getHours()).padStart(2,"0")}:${String(c.limite.getMinutes()).padStart(2,"0")}</span></div>
      <span class="tag warn">Para cargar</span></div>
      <div class="row" style="margin-top:10px"><button class="ghost small" data-lb="${esc(c.fecha)}|${esc(c.ini)}|${esc(c.fin)}">Cargar libro de temas</button></div></div>`).join("");
  const nPend = (pendiente ? 1 : 0) + lbe.atrasadas.length;
  const hayUrg = urgente || lbe.atrasadas.length > 0;
  $("#panel").innerHTML = `
    <h2 style="margin:4px 0 2px">${esc(nMat(cat.materiaId))}</h2>
    <div class="muted" style="margin-bottom:12px">${esc(nSede(cat.sedeId))}</div>
    ${nPend ? `<div class="msg ${hayUrg ? "bad" : ""}"><b>Tenés ${nPend} tarea${nPend>1?"s":""} pendiente${nPend>1?"s":""}</b>${hayUrg ? " · urgente" : ""}</div>`
      : `<div class="msg" style="background:#1e8e4e22">Están al día, no hay tareas pendientes. ✓</div>`}
    ${tareasLibro}${hoyLibro}
    ${!lbe.tieneHorario ? `<div class="msg">Todavía no está cargado el horario de esta cátedra, por eso no se controla el libro de temas. Podés cargar tus clases igual desde la pestaña Libro de temas.</div>` : ""}
    ${tarea}
    ${prox.length ? `<h3 style="margin:18px 0 8px">Próximas fechas</h3><div class="card">${prox.map(e => `
      <div class="ev"><span class="dot" style="background:${(TIPOS[e.tipo]||TIPOS.otro)[1]}"></span>
      <div class="fecha">${esc(fmtLarga(e.fecha))}</div><div class="cuerpo"><strong>${esc(e.titulo)}</strong></div></div>`).join("")}</div>` : ""}`;

    .sort((x, y) => ORDEN_K[x.k] - ORDEN_K[y.k] || nMat(x.c.materiaId).localeCompare(nMat(y.c.materiaId)));

    <div class="chips">
      ${chips.map(([k,t]) => `<button class="chip ${fcum.estado===k?"on":""}" data-k="${k}"><b>${base.filter(r=>r.k===k).length}</b><span>${t}</span></button>`).join("")}

      <select id="fs"><option value="">Todas las sedes</option>${sedes.map(s=>`<option value="${s.id}" ${fcum.sede===s.id?"selected":""}>${esc(s.nombre)}</option>`).join("")}</select>
      ${fcum.estado ? `<button class="ghost small" id="limpiar">Quitar filtro de estado</button>` : ""}
      <span class="muted">${vis.length} de ${base.length} cátedras</span>
    </div></div>
    <div class="card">
      ${vis.length ? `<table><tr><th>Cátedra</th><th>Programa</th><th>Libro de temas</th><th></th></tr>
      ${vis.map(r => `<tr>
        <td><strong>${esc(nMat(r.c.materiaId))}</strong><br><span class="muted">${esc(nSede(r.c.sedeId))}</span></td>
        <td>${tag(r.k, r.dl)}${r.p?.cargadoPor ? `<br><span class="muted">Cargó ${esc(r.p.cargadoPor)}</span>` : ""}${r.p?.comentario && r.k==="devuelto" ? `<br><span class="muted">${esc(r.p.comentario)}</span>`:""}</td>
        <td>${lbTag(r.lb)}</td>
        <td>${r.p ? `${enlace(r.p.link,"Ver")}

  if (catActual() && !fcal.sede && misSedes.size) ev = ev.filter(e => e.sedeId === "todas" || misSedes.has(e.sedeId));
  if (!fcal.pasados) ev = ev.filter(e => (e.fechaFin || e.fecha) >= h);
  const meses = {};
  ev.forEach(e => (meses[e.fecha.slice(0,7)] ||= []).push(e));
  $("#panel").innerHTML = `
    <div class="card">
      <div class="row sp">
        <div class="row">
          <select id="cs"><option value="">${catActual()?"Mis sedes":"Todas las sedes"}</option>${sedes.map(s=>`<option value="${s.id}" ${fcal.sede===s.id?"selected":""}>${esc(s.nombre)}</option>`).join("")}</select>
          <select id="ct"><option value="">Todos los tipos</option>${Object.entries(TIPOS).map(([k,[t]])=>`<option value="${k}" ${fcal.tipo===k?"selected":""}>${esc(t)}</option>`).join("")}</select>
          <label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="cp" ${fcal.pasados?"checked":""}> Ver pasados</label>

      ${ev.length ? Object.keys(meses).sort().map(k => `
        <div class="mes">${esc(fechaObj(k + "-15").toLocaleDateString("es-AR", { month: "long", year: "numeric" }))}</div>

          <div class="ev ${(e.fechaFin||e.fecha) < h ? "pasado" : ""}">

            <div class="fecha">${esc(fmtLarga(e.fecha))}${e.fechaFin && e.fechaFin !== e.fecha ? `<br><span class="muted">al ${esc(fmtLarga(e.fechaFin))}</span>` : ""}</div>
            <div class="cuerpo"><strong>${esc(e.titulo)}</strong><br>
              <span class="tag">${esc((TIPOS[e.tipo]||TIPOS.otro)[0])}</span><span class="tag off">${esc(nSede(e.sedeId))}</span>
              ${e.notas ? `<div class="muted">${esc(e.notas)}</div>` : ""}</div>
            ${admin ? `<div class="row"><button class="ghost small" data-ee="${esc(e.id)}">Editar</button><button class="ghost small danger" data-del="${esc(e.id)}">Borrar</button></div>` : ""}
          </div>`).join("")}`).join("")
      : `<div class="empty">${calendario.length ? "No hay eventos con ese filtro." : (admin ? "Todavía no cargaste eventos. Empezá con el vencimiento de programas: sin esa fecha no se calculan los atrasos." : "Todavía no hay eventos publicados.")}</div>`}
    </div>`;
  $("#cs").onchange = e => { fcal.sede = e.target.value; panelCalendario(); };

  $("#cp").onchange = e => { fcal.pasados = e.target.checked; panelCalendario(); };

function modalEvento(e) {
  const nuevo = !e;
  const bg = abrirModal(`
    <h3>${nuevo ? "Nuevo evento" : "Editar evento"}</h3>
    <label>Título</label><input id="t" style="width:100%" value="${esc(e?.titulo||"")}" placeholder="Ej.: Vencimiento de programas 2027">
    <div class="row"><div style="flex:1"><label>Tipo</label>
      <select id="tp" style="width:100%">${Object.entries(TIPOS).map(([k,[t]])=>`<option value="${k}" ${e?.tipo===k?"selected":""}>${esc(t)}</option>`).join("")}</select></div>
    <div style="flex:1"><label>Sede</label>
      <select id="sd" style="width:100%"><option value="todas">Todas las sedes</option>${sedes.map(s=>`<option value="${s.id}" ${e?.sedeId===s.id?"selected":""}>${esc(s.nombre)}</option>`).join("")}</select></div></div>
    <div class="row"><div style="flex:1"><label>Fecha</label><input id="f" type="date" style="width:100%" value="${esc(e?.fecha||"")}"></div>
    <div style="flex:1"><label>Hasta (opcional)</label><input id="ff" type="date" style="width:100%" value="${esc(e?.fechaFin||"")}"></div></div>
    ${nuevo ? `<label>Repetir cada mes hasta (opcional)</label><input id="rp" type="date" style="width:100%">
      <p class="muted" style="margin:6px 0 0">Útil para el cierre de notas mensual: crea un evento por mes con el mismo día.</p>` : ""}
    <label>Notas (opcional)</label><textarea id="n" rows="2">${esc(e?.notas||"")}</textarea>
    <div id="err" class="msg bad" hidden style="margin-top:10px"></div>
    <div class="row sp" style="margin-top:16px"><button class="ghost" id="cancel">Cancelar</button><button class="primary" id="ok">Guardar</button></div>`);
  $("#cancel", bg).onclick = () => bg.remove();
  $("#ok", bg).onclick = async () => {
    const err = $("#err", bg);
    const base = { titulo: $("#t", bg).value.trim(), tipo: $("#tp", bg).value, sedeId: $("#sd", bg).value,
      fecha: $("#f", bg).value, fechaFin: $("#ff", bg).value || "", notas: $("#n", bg).value.trim() };
    const rp = nuevo ? $("#rp", bg).value : "";
    if (!base.titulo || !base.fecha) { err.hidden = false; err.textContent = "Completá el título y la fecha."; return; }
    if (base.fechaFin && base.fechaFin < base.fecha) { err.hidden = false; err.textContent = "La fecha 'hasta' no puede ser anterior a la fecha de inicio."; return; }
    if (rp && rp < base.fecha) { err.hidden = false; err.textContent = "'Repetir hasta' tiene que ser posterior a la fecha."; return; }
    $("#ok", bg).disabled = true;
    try {
      if (!nuevo) await setDoc(doc(db, "calendario", e.id), base);
      else if (!rp) await setDoc(doc(collection(db, "calendario")), base);
      else {
        const b = writeBatch(db);
        const dur = base.fechaFin ? diffDias(base.fecha, base.fechaFin) : 0;
        for (let i = 0; i < 24; i++) {
          const f = addMes(base.fecha, i);
          if (f > rp) break;
          const ev = { ...base, fecha: f, fechaFin: dur ? (() => { const t = fechaObj(f); t.setDate(t.getDate() + dur); return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`; })() : "" };
          b.set(doc(collection(db, "calendario")), ev);
        }
        await b.commit();
      }
      bg.remove(); await cargarDatos(); panelCalendario();
    } catch (x) { err.hidden = false; err.textContent = "No se pudo guardar: " + (x.code||x.message); $("#ok", bg).disabled = false; }
  };
}

function descargarIcs(lista) {
  if (!lista.length) { alert("No hay eventos para descargar con el filtro actual."); return; }
  const t = s => String(s || "").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
  const d8 = f => f.replace(/-/g, "");
  const sig = f => { const x = fechaObj(f); x.setDate(x.getDate() + 1); return `${x.getFullYear()}${pad(x.getMonth()+1)}${pad(x.getDate())}`; };
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//EBNE Coordinacion//ES","CALSCALE:GREGORIAN","X-WR-CALNAME:Calendario académico EBNE"];
  lista.forEach(e => L.push("BEGIN:VEVENT", `UID:${e.id}@ebne-app`, `DTSTAMP:${stamp}`,
    `DTSTART;VALUE=DATE:${d8(e.fecha)}`, `DTEND;VALUE=DATE:${sig(e.fechaFin || e.fecha)}`,
    `SUMMARY:${t(e.titulo)}`, `DESCRIPTION:${t(`${(TIPOS[e.tipo]||TIPOS.otro)[0]} · ${nSede(e.sedeId)}${e.notas ? " · " + e.notas : ""}`)}`, "END:VEVENT"));
  L.push("END:VCALENDAR");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([L.join("\r\n")], { type: "text/calendar;charset=utf-8" }));
  a.download = "calendario-ebne.ics"; document.body.appendChild(a); a.click(); a.remove();
}

// ---------- Libro de temas: clases esperadas, atrasos y carga ----------
const DIAS = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const HORAS_LIMITE = 2;   // horas después de terminar la clase para completar el libro
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const idLibro = (sedeId, materiaId, fecha) => `${pid(sedeId, materiaId)}__${fecha}`;
const hrDe = (sedeId, materiaId) => horarios.find(x => x.id === pid(sedeId, materiaId));
const horarioTxt = h => (h?.dias || []).map(d => `${DIAS[d.dow].slice(0,3)} ${d.ini}-${d.fin}`).join(" · ");
function esFeriado(sedeId, f) {
  return calendario.some(e => e.tipo === "feriado" && (e.sedeId === "todas" || e.sedeId === sedeId) && e.fecha <= f && (e.fechaFin || e.fecha) >= f);
}
// Clases que deberían haberse dado hasta hoy (según horario, inicio/cierre de cuatrimestre y feriados).
function clasesEsperadas(sedeId, materiaId) {
  const h = hrDe(sedeId, materiaId);
  if (!h?.dias?.length) return [];
  const t = hoy();
  const delSede = e => e.sedeId === "todas" || e.sedeId === sedeId;
  const ini = calendario.filter(e => e.tipo === "inicio_cuatrimestre" && e.fecha <= t && delSede(e)).sort((a,b) => b.fecha.localeCompare(a.fecha))[0];
  if (!ini) return [];
  const cie = calendario.filter(e => e.tipo === "cierre_cuatrimestre" && e.fecha >= ini.fecha && delSede(e)).sort((a,b) => a.fecha.localeCompare(b.fecha))[0];
  const out = [];
  for (const d = fechaObj(ini.fecha); ymd(d) <= t; d.setDate(d.getDate() + 1)) {
    const f = ymd(d);
    if (cie && f > (cie.fechaFin || cie.fecha)) break;
    if (esFeriado(sedeId, f)) continue;
    for (const s of h.dias) if (+s.dow === d.getDay()) {
      const [hh, mm] = s.fin.split(":").map(Number);
      out.push({ fecha: f, ini: s.ini, fin: s.fin, limite: new Date(d.getFullYear(), d.getMonth(), d.getDate(), hh + HORAS_LIMITE, mm) });
    }
  }
  return out;
}
function libroEstado(sedeId, materiaId) {
  const esp = clasesEsperadas(sedeId, materiaId);
  const cargados = new Set(libros.filter(l => l.sedeId === sedeId && l.materiaId === materiaId).map(l => l.fecha));
  const now = new Date();
  return {
    tieneHorario: !!hrDe(sedeId, materiaId)?.dias?.length,
    esp,
    atrasadas: esp.filter(c => c.limite < now && !cargados.has(c.fecha)),
    deHoy: esp.filter(c => c.fecha === hoy() && c.limite >= now && !cargados.has(c.fecha)),
  };
}
const lbTag = lb => !lb.tieneHorario ? `<span class="tag pend">Sin horario</span>`
  : lb.atrasadas.length ? `<span class="tag bad">${lb.atrasadas.length} sin cargar</span>` : `<span class="tag ok">Al día</span>`;
const fmtClase = c => `${fmtLarga(c.fecha)} · ${c.ini}–${c.fin}`;

// Administración (contable): presentismo de los profes
let fpre = { sede: "", dias: 30 };
function panelPresentismo() {
  const desde = (() => { const d = new Date(); d.setDate(d.getDate() - fpre.dias); return ymd(d); })();
  const filas = [];
  for (const c of combosActivos()) {
    if (fpre.sede && c.sedeId !== fpre.sede) continue;
    const mios = libros.filter(l => l.sedeId === c.sedeId && l.materiaId === c.materiaId);
    for (const e of clasesEsperadas(c.sedeId, c.materiaId)) {
      if (e.fecha < desde) continue;
      const l = mios.find(x => x.fecha === e.fecha);
      filas.push({ c, e, l, vencida: e.limite < new Date() });
    }
  }
  filas.sort((a, b) => b.e.fecha.localeCompare(a.e.fecha) || nMat(a.c.materiaId).localeCompare(nMat(b.c.materiaId)));
  const sinReg = filas.filter(f => !f.l && f.vencida).length;
  const sinHorario = combosActivos().filter(c => !hrDe(c.sedeId, c.materiaId)?.dias?.length).length;
  $("#panel").innerHTML = `
    ${sinHorario ? `<div class="msg">${sinHorario} cátedras no tienen horario cargado, así que no aparecen acá.</div>` : ""}
    <div class="card"><div class="row sp"><div class="row">
      <select id="fs"><option value="">Todas las sedes</option>${sedes.map(s=>`<option value="${s.id}" ${fpre.sede===s.id?"selected":""}>${esc(s.nombre)}</option>`).join("")}</select>
      <select id="fd">${[[7,"Últimos 7 días"],[30,"Últimos 30 días"],[90,"Últimos 90 días"]].map(([n,t])=>`<option value="${n}" ${fpre.dias===n?"selected":""}>${t}</option>`).join("")}</select></div>
      <span class="muted">${filas.length} clases · <b>${sinReg}</b> sin registro</span></div></div>
    <div class="card">${filas.length ? `<table class="hide3"><tr><th>Clase</th><th>Cátedra</th><th>Presentismo</th><th>Observaciones</th></tr>
      ${filas.map(f => `<tr><td>${esc(fmtLarga(f.e.fecha))}<br><span class="muted">${f.e.ini}–${f.e.fin}</span></td>
        <td><strong>${esc(nMat(f.c.materiaId))}</strong><br><span class="muted">${esc(nSede(f.c.sedeId))}</span></td>
        <td>${f.l ? `<span class="tag ok">Presente</span><br><span class="muted">${esc(f.l.cargadoPor||"")} · ${esc(f.l.horaInicio||"?")}–${esc(f.l.horaFin||"?")}</span>`
          : f.vencida ? `<span class="tag bad">Sin registro</span>` : `<span class="tag pend">Pendiente</span>`}</td>
        <td>${f.l ? esc((f.l.obsClase||"").slice(0,120)) + (f.l.incidencias ? `<br><span class="tag warn">Incidencia</span> ${esc(f.l.incidencias.slice(0,80))}` : "") : ""}</td></tr>`).join("")}</table>`
      : `<div class="empty">No hay clases esperadas en el período. Se calculan con el horario de cada cátedra y el inicio de cuatrimestre del calendario.</div>`}</div>`;
  $("#fs").onchange = e => { fpre.sede = e.target.value; panelPresentismo(); };
  $("#fd").onchange = e => { fpre.dias = +e.target.value; panelPresentismo(); };
}

    if (mails.some(m => !mailOk(m))) { err.hidden = false; err.textContent = "Revisá los mails: hay alguno con formato inválido."; return; }
    const dias = [...bg.querySelectorAll(".hr")].map(r => ({ dow: +$(".hd", r).value, ini: $(".hi", r).value, fin: $(".hf", r).value }));
    if (dias.some(d => !d.ini || !d.fin || d.fin <= d.ini)) { err.hidden = false; err.textContent = "Revisá el horario: cada día necesita hora de inicio y una hora de fin posterior."; return; }
    $("#ok", bg).disabled = true;
    try {
      await setDoc(doc(db, "horarios", id), { sedeId, materiaId, dias });
      await setDoc(doc(db, "catedras", id), { sedeId, materiaId, clave, mails, nombres: $("#nn", bg).value.trim() }, { merge: true });
      bg.remove(); await cargarDatos(); panelCatedras();
    } catch (e) { err.hidden = false; err.textContent = "No se pudo guardar: " + (e.code||e.message); $("#ok", bg).disabled = false; }
  };
}

// ---------- Gestión: Accesos (claves de las áreas y cuentas de Google) ----------
function panelAccesos() {
  const lista = usuarios.filter(u => rolDe(u) === "admin");
  const ar = k => areas.find(x => x.id === k);
  $("#panel").innerHTML = `
    <div class="card"><strong>Claves de las áreas</strong>
      <p class="muted">Cada área ingresa desde la pantalla inicial eligiéndose en el desplegable y escribiendo su clave.</p>
      <table><tr><th>Área</th><th>Puede</th><th>Clave</th><th></th></tr>
      ${Object.entries(AREAS).map(([k,[n,nv]]) => `<tr>
        <td><strong>${esc(n)}</strong></td>
        <td class="muted">${nv==="full"?"Ver y editar todo":nv==="lector"?"Solo ver seguimiento y calendario":"Ver presentismo docente"}</td>
        <td>${ar(k)?.clave ? `<code>${esc(ar(k).clave)}</code>` : `<span class="tag warn">Sin clave</span>`}</td>
        <td><button class="ghost small" data-a="${k}">${ar(k)?.clave ? "Cambiar" : "Generar"}</button></td></tr>`).join("")}
      </table></div>
    <div class="card"><div class="row sp"><strong>Propietarios con Google</strong><button class="primary small" id="nuevo">+ Agregar</button></div>
      <p class="muted">Entran con “Acceso del propietario (Google)” y ven todo.</p>
      ${lista.length ? `<table><tr><th>Persona</th><th>Estado</th><th></th></tr>
      ${lista.map(u => `<tr><td><strong>${esc(u.nombre||"(sin nombre)")}</strong><br><span class="muted">${esc(u.email)}</span></td>
        <td><span class="tag ${u.activo===false?"off":"ok"}">${u.activo===false?"Inactivo":"Activo"}</span></td>
        <td><button class="ghost small" data-e="${esc(u.id)}">Editar</button></td></tr>`).join("")}</table>`
      : `<div class="empty">Solo figurás vos por defecto.</div>`}
    </div>`;
  $("#nuevo").onclick = () => modalUsuario(null);
  $("#panel").querySelectorAll("[data-e]").forEach(b => b.onclick = () => modalUsuario(usuarios.find(u => u.id === b.dataset.e)));
  $("#panel").querySelectorAll("[data-a]").forEach(b => b.onclick = async () => {
    const k = b.dataset.a;
    if (ar(k)?.clave && !confirm(`Si cambiás la clave de ${AREAS[k][0]}, quienes la tienen deberán ingresar de nuevo. ¿Seguro?`)) return;
    await setDoc(doc(db, "areas", k), { nombre: AREAS[k][0], clave: nuevaClave() }, { merge: true });
    await cargarDatos(); panelAccesos();
  });
}


function modalUsuario(u) {
  const nuevo = !u;
  const bg = abrirModal(`
    <h3>${nuevo ? "Agregar al equipo de gestión" : "Editar persona"}</h3>
    <label>Nombre y apellido</label><input id="n" style="width:100%" value="${esc(u?.nombre||"")}">
    <label>Mail de Google</label><input id="e" type="email" style="width:100%" value="${esc(u?.email||"")}" ${nuevo?"":"disabled"}>
    <label>Estado</label>
    <select id="a" style="width:100%"><option value="1">Activo</option><option value="0" ${u?.activo===false?"selected":""}>Inactivo</option></select>
    <div id="err" class="msg bad" hidden style="margin-top:10px"></div>
    <div class="row sp" style="margin-top:16px"><button class="ghost" id="cancel">Cancelar</button><button class="primary" id="ok">Guardar</button></div>`);
  $("#cancel", bg).onclick = () => bg.remove();
  $("#ok", bg).onclick = async () => {
    const email = $("#e", bg).value.trim().toLowerCase(), nombre = $("#n", bg).value.trim();
    const err = $("#err", bg);
    if (!nombre || !mailOk(email)) { err.hidden = false; err.textContent = "Completá nombre y un mail válido."; return; }
    $("#ok", bg).disabled = true;
    try { await setDoc(doc(db, "usuarios", email), { email, nombre, rol: "admin", activo: $("#a", bg).value === "1" }, { merge: true }); bg.remove(); await cargarDatos(); vista(); }
    catch (e) { err.hidden = false; err.textContent = "No se pudo guardar: " + (e.code||e.message); $("#ok", bg).disabled = false; }
  };
}

// ---------- Sedes y materias (admin) ----------
function panelSedes() {
  $("#panel").innerHTML = `
    <div class="card"><div class="row sp"><strong>Sedes</strong><button class="primary" id="nueva">+ Nueva sede</button></div>
    <p class="muted">Sumar una sede nueva no cambia nada más: las materias son las mismas en todas.</p>
    <table><tr><th>Sede</th><th>Estado</th><th></th></tr>
    ${sedes.map(s=>`<tr><td><strong>${esc(s.nombre)}</strong></td><td><span class="tag ${s.activa===false?"off":"ok"}">${s.activa===false?"Inactiva":"Activa"}</span></td>
      <td><button class="ghost" data-t="${s.id}">${s.activa===false?"Activar":"Desactivar"}</button></td></tr>`).join("")}
    </table></div>`;
  $("#nueva").onclick = async () => {
    const n = prompt("Nombre de la nueva sede"); if (!n || !n.trim()) return;
    await setDoc(doc(db,"sedes",slug(n)), { nombre:n.trim(), activa:true, orden:sedes.length });
    await cargarDatos(); vista();
  };
  $("#panel").querySelectorAll("[data-t]").forEach(b => b.onclick = async () => {
    const s = sedes.find(x => x.id === b.dataset.t);
    await updateDoc(doc(db,"sedes",s.id), { activa: s.activa === false });
    await cargarDatos(); vista();
  });
}

function panelMaterias() {
  const areas = [...new Set(materias.map(m => m.area))];
  $("#panel").innerHTML = `<div class="card"><strong>Materias (iguales en todas las sedes)</strong>
    ${areas.map(a => `<h4 style="margin:14px 0 4px">${esc(a)}</h4><table>
      ${materias.filter(m=>m.area===a).map(m=>`<tr><td>${esc(m.nombre)}</td></tr>`).join("")}</table>`).join("")}
    </div>`;
}
</script>
