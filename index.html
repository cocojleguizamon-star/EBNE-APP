<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EBNE Coordinación</title>
<link rel="icon" href="logo.png">
<style>
  :root{
    --rojo:#c8202f; --azul:#1f6fb2; --azul-osc:#0f4c81; --bg:#f4f6f9; --card:#fff;
    --txt:#1b2733; --sub:#5b6b7b; --borde:#dbe2ea; --ok:#1e8e4e; --warn:#c77700; --bad:#c8202f;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#10161d; --card:#18212b; --txt:#e8eef4; --sub:#9bacbc; --borde:#2a3643; --ok:#43b878; --warn:#e0a03a; --bad:#ff6b78; }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);}
  header{background:var(--azul-osc);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;position:sticky;top:0;z-index:5}
  header img{height:40px;background:#fff;border-radius:8px;padding:2px}
  header h1{font-size:1.05rem;margin:0;flex:1}
  header .who{font-size:.8rem;opacity:.9;text-align:right}
  header button{background:transparent;border:1px solid #ffffff88;color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
  main{max-width:980px;margin:0 auto;padding:16px}
  .login{max-width:380px;margin:12vh auto;text-align:center;background:var(--card);border:1px solid var(--borde);border-radius:16px;padding:28px 22px}
  .login img{width:170px}
  .login h2{margin:.4rem 0 .2rem}
  .login p{color:var(--sub);margin:.2rem 0 1.2rem}
  button.primary{background:var(--rojo);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;font-size:.95rem}
  button.ghost{background:transparent;color:var(--azul);border:1px solid var(--borde);border-radius:10px;padding:8px 12px;cursor:pointer}
  button.small{padding:5px 9px;font-size:.82rem;border-radius:8px}
  button.danger{color:var(--bad)}
  button:disabled{opacity:.5;cursor:default}
  nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  nav.tabs button{background:var(--card);border:1px solid var(--borde);border-radius:999px;padding:8px 14px;cursor:pointer;color:var(--txt)}
  nav.tabs button.on{background:var(--azul);border-color:var(--azul);color:#fff}
  .card{background:var(--card);border:1px solid var(--borde);border-radius:14px;padding:14px;margin-bottom:12px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .row.sp{justify-content:space-between}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--borde);vertical-align:top}
  th{color:var(--sub);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em}
  .tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.75rem;background:#1f6fb21f;color:var(--azul);margin:1px 2px 1px 0}
  .tag.off{background:#8881;color:var(--sub)}
  .tag.ok{background:#1e8e4e22;color:var(--ok)}
  .tag.pend{background:#8882;color:var(--sub)}
  .tag.warn{background:#c7770026;color:var(--warn)}
  .tag.bad{background:#c8202f22;color:var(--bad)}
  .tag.info{background:#1f6fb22a;color:var(--azul)}
  input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--borde);border-radius:10px;padding:9px 10px;min-width:0}
  textarea{width:100%;resize:vertical}
  label{display:block;font-size:.8rem;color:var(--sub);margin:10px 0 4px}
  .modal-bg{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:10}
  .modal{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:520px;border:1px solid var(--borde)}
  .modal h3{margin:0 0 4px}
  .asig{display:flex;gap:6px;margin-bottom:6px}
  .asig select{flex:1}
  .msg{padding:10px 12px;border-radius:10px;background:#c7770018;color:var(--txt);margin-bottom:12px;font-size:.9rem}
  .msg.bad{background:#c8202f18}
  .empty{color:var(--sub);text-align:center;padding:22px}
  .muted{color:var(--sub);font-size:.85rem}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .chip{border:1px solid var(--borde);background:var(--card);border-radius:12px;padding:8px 12px;cursor:pointer;text-align:left;color:var(--txt);min-width:96px}
  .chip b{display:block;font-size:1.3rem}
  .chip span{font-size:.75rem;color:var(--sub)}
  .chip.on{border-color:var(--azul);box-shadow:0 0 0 2px #1f6fb244}
  .mes{margin:16px 0 6px;text-transform:capitalize;font-size:.95rem;color:var(--sub)}
  .ev{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--borde)}
  .ev.pasado{opacity:.55}
  .ev .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
  .ev .fecha{width:92px;flex:none;font-size:.85rem;text-transform:capitalize}
  .ev .cuerpo{flex:1;min-width:0}
  a{color:var(--azul)}
  @media (max-width:640px){ table.hide3 th:nth-child(3), table.hide3 td:nth-child(3){display:none} .ev .fecha{width:78px} }
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="EPSA">
  <h1>EBNE Coordinación</h1>
  <div class="who" id="who"></div>
  <button id="btnSalir" hidden>Salir</button>
</header>
<main id="app"><div class="empty">Cargando…</div></main>

<script type="module">
import { firebaseConfig } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, writeBatch, query, orderBy, where }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const ADMIN_ORIGEN = "cocojleguizamon@gmail.com";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ---------- Datos iniciales ----------
const SEDES_INICIALES = ["Córdoba", "Ballester", "CABA"];
const MATERIAS_INICIALES = [
  ["Natación", "Prácticas y condición física"],
  ["Preparación Física", "Prácticas y condición física"],
  ["Técnicas y Estrategias de Salvamento", "Prácticas y condición física"],
  ["Anatomía y Fisiología del Cuerpo Humano", "Ciencias aplicadas a la salud"],
  ["Educación Sanitaria", "Ciencias aplicadas a la salud"],
  ["Primeros Auxilios y Técnicas Sanitarias Específicas", "Ciencias aplicadas a la salud"],
  ["Reanimación Cardiopulmonar (RCP)", "Ciencias aplicadas a la salud"],
  ["Aspectos Psicosociales, Éticos y Legales de la Profesión", "Fundamento teórico profesional"],
  ["Problemática del Ahogamiento", "Fundamento teórico profesional"],
  ["Entornos Acuáticos", "Fundamento teórico profesional"],
];
const TIPOS = {
  inicio_cuatrimestre: ["Inicio de cuatrimestre", "#1e8e4e"],
  cierre_cuatrimestre: ["Cierre de cuatrimestre", "#0f4c81"],
  vencimiento_programa: ["Vencimiento de programa", "#c8202f"],
  cierre_notas: ["Cierre de notas del mes", "#c77700"],
  testeo: ["Testeo", "#7b3fb0"],
  parcial: ["Parcial / examen", "#1f6fb2"],
  feriado: ["Feriado / sin clases", "#7a8794"],
  otro: ["Otro", "#4b5b6b"],
};
const TABS = {
  admin: [["cumplimiento","Seguimiento"],["calendario","Calendario"],["docentes","Docentes"],["sedes","Sedes"],["materias","Materias"]],
  docente: [["mis","Mis tareas"],["calendario","Calendario"]],
};

// ---------- Utilidades ----------
const pad = n => String(n).padStart(2, "0");
const slug = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = (s, r=document) => r.querySelector(s);
const hoy = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const fechaObj = f => new Date(f + "T12:00:00");
const diffDias = (a, b) => Math.round((fechaObj(b) - fechaObj(a)) / 864e5);
const fmtCorta = f => fechaObj(f).toLocaleDateString("es-AR", { day: "numeric", month: "short" });
const fmtLarga = f => fechaObj(f).toLocaleDateString("es-AR", { weekday: "short", day: "numeric", month: "short" });
const urlOk = u => /^https?:\/\//i.test(u || "");
const pid = (sedeId, materiaId, email) => `${sedeId}__${materiaId}__${email}`;
// Dos perfiles: Administración (admin / coordinador) y Docente.
const rolDe = u => (u?.rol === "admin" || u?.rol === "coordinador") ? "admin" : "docente";
const esGestion = () => rolDe(me) === "admin";
// Vista previa: el admin puede ver la pantalla exacta de un docente (solo lectura).
let preview = null;
const eff = () => preview || me;
function addMes(f, n) {
  const [y, m, d] = f.split("-").map(Number);
  const t = new Date(y, m - 1 + n, 1);
  const ult = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(Math.min(d, ult))}`;
}

// ---------- Estado ----------
let me = null;
let sedes = [], materias = [], usuarios = [], calendario = [], programas = [];
let tab = "mis";
let filtro = { sede: "", materia: "", q: "" };
let fcal = { sede: "", tipo: "", pasados: false };
let fcum = { sede: "", estado: "" };

const app$ = $("#app");
$("#btnSalir").onclick = () => signOut(auth);

onAuthStateChanged(auth, async (u) => {
  if (!u) return pantallaLogin();
  try { await cargarSesion(u); }
  catch (e) { console.error(e); pantallaError(e); }
});

function pantallaLogin(msg) {
  $("#who").textContent = ""; $("#btnSalir").hidden = true;
  app$.innerHTML = `
    <div class="login">
      <img src="logo.png" alt="EPSA">
      <h2>EBNE Coordinación</h2>
      <p>Ingresá con la cuenta de Google que registró la coordinación.</p>
      ${msg ? `<div class="msg">${esc(msg)}</div>` : ""}
      <button class="primary" id="go">Ingresar con Google</button>
    </div>`;
  $("#go").onclick = async () => {
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch (e) { pantallaLogin("No se pudo iniciar sesión: " + (e.code || e.message)); }
  };
}
function pantallaError(e) {
  app$.innerHTML = `<div class="card"><div class="msg bad">Ocurrió un error: ${esc(e.code || e.message)}</div>
  <button class="ghost" onclick="location.reload()">Reintentar</button></div>`;
}

async function cargarSesion(u) {
  const email = u.email.toLowerCase();
  const snap = await getDoc(doc(db, "usuarios", email));
  me = snap.exists() ? { id: email, ...snap.data() } : null;
  if (!me && email === ADMIN_ORIGEN) me = { id: email, email, nombre: u.displayName || "Administrador", rol: "admin", activo: true, asignaciones: [] };
  if (!me || me.activo === false) {
    await signOut(auth);
    return pantallaLogin("Tu mail (" + email + ") no está habilitado. Pedile el alta a la coordinación.");
  }
  $("#who").innerHTML = `${esc(me.nombre || email)}<br>${rolDe(me)==="admin"?"Administración":"Docente"}`;
  $("#btnSalir").hidden = false;
  preview = null; tab = TABS[rolDe(me)][0][0];
  await cargarDatos();
  vista();
}

async function cargarDatos() {
  const gestion = esGestion();
  const [s, m, c, us, pr] = await Promise.all([
    getDocs(query(collection(db, "sedes"), orderBy("orden"))),
    getDocs(query(collection(db, "materias"), orderBy("orden"))),
    getDocs(query(collection(db, "calendario"), orderBy("fecha"))),
    gestion ? getDocs(collection(db, "usuarios")) : Promise.resolve(null),
    gestion ? getDocs(collection(db, "programas"))
            : getDocs(query(collection(db, "programas"), where("docenteEmail", "==", me.id))),
  ]);
  sedes = s.docs.map(d => ({ id: d.id, ...d.data() }));
  materias = m.docs.map(d => ({ id: d.id, ...d.data() }));
  calendario = c.docs.map(d => ({ id: d.id, ...d.data() }));
  programas = pr.docs.map(d => ({ id: d.id, ...d.data() }));
  if (us) usuarios = us.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (a.nombre||"").localeCompare(b.nombre||""));
}
const nSede = id => id === "todas" ? "Todas las sedes" : (sedes.find(s => s.id === id)?.nombre ?? id);
const nMat = id => materias.find(m => m.id === id)?.nombre ?? id;

// ---------- Estructura general ----------
function vista() {
  const rol = rolDe(eff());
  if (!TABS[rol].some(t => t[0] === tab)) tab = TABS[rol][0][0];
  const vacio = rol === "admin" && !preview && (!sedes.length || !materias.length);
  const docs = usuarios.filter(u => rolDe(u) === "docente" && u.activo !== false);
  app$.innerHTML = `
    ${preview ? `<div class="msg row sp"><span>Estás viendo la pantalla de <b>${esc(preview.nombre || preview.email)}</b> (solo lectura).</span>
      <button class="ghost small" id="salirPrev">Volver a Administración</button></div>` : ""}
    ${esGestion() && !preview ? `<div class="row" style="margin-bottom:10px"><span class="muted">Ver como docente:</span>
      <select id="prev"><option value="">Elegir…</option>${docs.map(d=>`<option value="${esc(d.id)}">${esc(d.nombre||d.email)}</option>`).join("")}</select>
      ${docs.length ? "" : `<span class="muted">(primero agregá un docente)</span>`}</div>` : ""}
    ${vacio ? `<div class="msg row sp"><span>Todavía no hay sedes o materias cargadas.</span>
      <button class="primary" id="seed">Cargar sedes y materias iniciales</button></div>` : ""}
    <nav class="tabs">
      ${TABS[rol].map(([k,t]) => `<button data-t="${k}" class="${tab===k?"on":""}">${t}</button>`).join("")}
    </nav>
    <section id="panel"></section>`;
  if (vacio) $("#seed").onclick = cargarIniciales;
  if ($("#prev")) $("#prev").onchange = e => { preview = usuarios.find(u => u.id === e.target.value) || null; tab = "mis"; vista(); };
  if ($("#salirPrev")) $("#salirPrev").onclick = () => { preview = null; tab = "cumplimiento"; vista(); };
  app$.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => { tab = b.dataset.t; vista(); });
  ({ cumplimiento: panelCumplimiento, calendario: panelCalendario, docentes: panelDocentes,
     sedes: panelSedes, materias: panelMaterias, mis: panelMis })[tab]();
}

function abrirModal(html) {
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(bg);
  return bg;
}

async function cargarIniciales() {
  const b = writeBatch(db);
  if (!sedes.length) SEDES_INICIALES.forEach((n,i) => b.set(doc(db,"sedes",slug(n)), { nombre:n, activa:true, orden:i }));
  if (!materias.length) MATERIAS_INICIALES.forEach(([n,a],i) => b.set(doc(db,"materias",slug(n)), { nombre:n, area:a, activa:true, orden:i }));
  await b.commit(); await cargarDatos(); vista();
}

// ---------- Programas: fechas límite y estados ----------
function vencimientoDe(sedeId) {
  const l = calendario
    .filter(e => e.tipo === "vencimiento_programa" && (e.sedeId === "todas" || e.sedeId === sedeId))
    .sort((a,b) => a.fecha.localeCompare(b.fecha));
  return l.find(e => e.fecha >= hoy()) || l[l.length - 1] || null;
}
function claveEstado(p, dl) {
  if (p?.estado === "aprobado") return "aprobado";
  if (p?.estado === "cargado") return "cargado";
  if (p?.estado === "devuelto") return "devuelto";
  if (!dl) return "pendiente";
  const d = diffDias(hoy(), dl.fecha);
  return d < 0 ? "atrasado" : d <= 7 ? "porvencer" : "pendiente";
}
function etiqueta(k, dl) {
  const d = dl ? diffDias(hoy(), dl.fecha) : null;
  switch (k) {
    case "aprobado": return ["ok", "Aprobado"];
    case "cargado": return ["info", "Para revisar"];
    case "devuelto": return ["warn", "Devuelto"];
    case "atrasado": return ["bad", `Atrasado ${-d} d`];
    case "porvencer": return ["warn", d === 0 ? "Vence hoy" : `Vence en ${d} d`];
    default: return ["pend", dl ? `Pendiente · vence ${fmtCorta(dl.fecha)}` : "Pendiente · sin fecha límite"];
  }
}
const tag = (k, dl) => { const [c, t] = etiqueta(k, dl); return `<span class="tag ${c}">${esc(t)}</span>`; };
const enlace = (u, t) => urlOk(u) ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>` : "";

// ---------- Panel docente: Mis tareas ----------
function panelMis() {
  const yo = eff();
  const asig = yo.asignaciones || [];
  const filas = asig.map(a => {
    const p = programas.find(x => x.id === pid(a.sedeId, a.materiaId, yo.id));
    const dl = vencimientoDe(a.sedeId);
    return { a, p, dl, k: claveEstado(p, dl) };
  });
  const pend = filas.filter(f => ["atrasado","devuelto","porvencer","pendiente"].includes(f.k))
    .sort((x, y) => ORDEN_K[x.k] - ORDEN_K[y.k]);
  const resto = filas.filter(f => !pend.includes(f));
  const urg = pend.filter(f => f.k === "atrasado" || f.k === "devuelto").length;
  const h = hoy();
  const prox = calendario.filter(e => (e.fechaFin || e.fecha) >= h &&
    (e.sedeId === "todas" || asig.some(a => a.sedeId === e.sedeId))).slice(0, 3);
  const btn = f => f.k === "aprobado" ? "" :
    `<button class="${["pendiente","porvencer","atrasado","devuelto"].includes(f.k) ? "primary" : "ghost"} small" data-p="${esc(f.a.sedeId)}|${esc(f.a.materiaId)}">${f.p ? "Actualizar programa" : "Cargar programa"}</button>`;
  const card = f => `
    <div class="card" style="border-left:4px solid ${f.k==="atrasado"?"var(--bad)":f.k==="devuelto"||f.k==="porvencer"?"var(--warn)":"var(--borde)"}">
      <div class="row sp">
        <div><strong>Cargar el programa de ${esc(nMat(f.a.materiaId))}</strong><br><span class="muted">${esc(nSede(f.a.sedeId))}</span></div>
        <div>${tag(f.k, f.dl)}</div>
      </div>
      ${f.k === "devuelto" && f.p?.comentario ? `<div class="msg" style="margin-top:10px"><b>Coordinación te pidió corregir:</b> ${esc(f.p.comentario)}</div>` : ""}
      <div class="row" style="margin-top:10px">${btn(f)} ${f.p?.link ? enlace(f.p.link, "Ver lo cargado") : ""}</div>
    </div>`;
  $("#panel").innerHTML = `
    <h2 style="margin:4px 0 10px">Hola, ${esc((yo.nombre||"").split(" ")[0] || "docente")}</h2>
    ${pend.length ? `<div class="msg ${urg ? "bad" : ""}"><b>Tenés ${pend.length} tarea${pend.length>1?"s":""} pendiente${pend.length>1?"s":""}</b>${urg ? ` · ${urg} urgente${urg>1?"s":""}` : ""}</div>`
      : filas.length ? `<div class="msg" style="background:#1e8e4e22">Estás al día, no tenés tareas pendientes. ✓</div>` : ""}
    ${pend.map(card).join("")}
    ${resto.length ? `<h3 style="margin:18px 0 8px">Al día</h3>${resto.map(f => `
      <div class="card"><div class="row sp">
        <div><strong>${esc(nMat(f.a.materiaId))}</strong><br><span class="muted">${esc(nSede(f.a.sedeId))}</span></div>
        <div>${tag(f.k, f.dl)} ${f.p?.link ? enlace(f.p.link, "Ver programa") : ""}</div></div></div>`).join("")}` : ""}
    ${!filas.length ? `<div class="card"><div class="empty">Todavía no tenés materias asignadas.</div></div>` : ""}
    ${prox.length ? `<h3 style="margin:18px 0 8px">Próximas fechas</h3><div class="card">${prox.map(e => `
      <div class="ev"><span class="dot" style="background:${(TIPOS[e.tipo]||TIPOS.otro)[1]}"></span>
      <div class="fecha">${esc(fmtLarga(e.fecha))}</div><div class="cuerpo"><strong>${esc(e.titulo)}</strong><br><span class="tag off">${esc(nSede(e.sedeId))}</span></div></div>`).join("")}</div>` : ""}`;
  $("#panel").querySelectorAll("[data-p]").forEach(b => b.onclick = () => {
    if (preview) { alert("Es una vista previa: acá no se puede cargar nada."); return; }
    const [sedeId, materiaId] = b.dataset.p.split("|");
    modalPrograma(sedeId, materiaId);
  });
}

function modalPrograma(sedeId, materiaId) {
  const id = pid(sedeId, materiaId, me.id);
  const p = programas.find(x => x.id === id);
  const bg = abrirModal(`
    <h3>Programa de ${esc(nMat(materiaId))}</h3>
    <div class="muted">${esc(nSede(sedeId))}</div>
    <label>Link al programa (Drive u otro)</label>
    <input id="l" type="url" style="width:100%" placeholder="https://drive.google.com/..." value="${esc(p?.link||"")}">
    <p class="muted" style="margin:6px 0 0">En Drive, compartí el archivo con permiso de lectura para quien tenga el link.</p>
    <label>Aclaración (opcional)</label>
    <textarea id="n" rows="3">${esc(p?.nota||"")}</textarea>
    <div id="err" class="msg bad" hidden style="margin-top:10px"></div>
    <div class="row sp" style="margin-top:16px"><button class="ghost" id="cancel">Cancelar</button><button class="primary" id="ok">Enviar a revisión</button></div>`);
  $("#cancel", bg).onclick = () => bg.remove();
  $("#ok", bg).onclick = async () => {
    const link = $("#l", bg).value.trim(), err = $("#err", bg);
    if (!urlOk(link)) { err.hidden = false; err.textContent = "Pegá un link válido que empiece con http:// o https://"; return; }
    $("#ok", bg).disabled = true;
    try {
      await setDoc(doc(db, "programas", id), {
        sedeId, materiaId, docenteEmail: me.id, docenteNombre: me.nombre || me.id,
        link, nota: $("#n", bg).value.trim(), estado: "cargado", comentario: "",
        cargadoEn: new Date().toISOString(),
      }, { merge: true });
      bg.remove(); await cargarDatos(); vista();
    } catch (e) { err.hidden = false; err.textContent = "No se pudo guardar: " + (e.code||e.message); $("#ok", bg).disabled = false; }
  };
}

// ---------- Panel de cumplimiento (admin / coordinación) ----------
const ORDEN_K = { atrasado: 0, devuelto: 1, porvencer: 2, cargado: 3, pendiente: 4, aprobado: 5 };
function panelCumplimiento() {
  const todas = [];
  for (const u of usuarios) {
    if (u.activo === false) continue;
    for (const a of (u.asignaciones || [])) {
      const p = programas.find(x => x.id === pid(a.sedeId, a.materiaId, u.id));
      const dl = vencimientoDe(a.sedeId);
      todas.push({ u, a, p, dl, k: claveEstado(p, dl) });
    }
  }
  const base = todas.filter(r => !fcum.sede || r.a.sedeId === fcum.sede);
  const vis = base.filter(r => !fcum.estado || r.k === fcum.estado)
    .sort((x, y) => ORDEN_K[x.k] - ORDEN_K[y.k] || (x.u.nombre||"").localeCompare(y.u.nombre||""));
  const chips = [["atrasado","Atrasados"],["devuelto","Devueltos"],["porvencer","Por vencer"],["cargado","Para revisar"],["pendiente","Pendientes"],["aprobado","Aprobados"]];
  const sinFecha = sedes.some(s => s.activa !== false && !vencimientoDe(s.id));
  $("#panel").innerHTML = `
    ${sinFecha ? `<div class="msg">Falta cargar en el Calendario el <b>vencimiento de programa</b> de alguna sede. Sin esa fecha no se puede calcular el atraso.</div>` : ""}
    <div class="chips">
      ${chips.map(([k,t]) => `<button class="chip ${fcum.estado===k?"on":""}" data-k="${k}"><b>${base.filter(r=>r.k===k).length}</b><span>${t}</span></button>`).join("")}
    </div>
    <div class="card"><div class="row">
      <select id="fs"><option value="">Todas las sedes</option>${sedes.map(s=>`<option value="${s.id}" ${fcum.sede===s.id?"selected":""}>${esc(s.nombre)}</option>`).join("")}</select>
      ${fcum.estado ? `<button class="ghost small" id="limpiar">Quitar filtro de estado</button>` : ""}
      <span class="muted">${vis.length} de ${base.length} programas</span>
    </div></div>
    <div class="card">
      ${vis.length ? `<table><tr><th>Docente</th><th>Materia · sede</th><th>Estado</th><th></th></tr>
      ${vis.map(r => `<tr>
        <td><strong>${esc(r.u.nombre||"(sin nombre)")}</strong><br><span class="muted">${esc(r.u.email)}</span></td>
        <td>${esc(nMat(r.a.materiaId))}<br><span class="muted">${esc(nSede(r.a.sedeId))}</span></td>
        <td>${tag(r.k, r.dl)}${r.p?.comentario && r.k==="devuelto" ? `<br><span class="muted">${esc(r.p.comentario)}</span>`:""}</td>
        <td>${r.p ? `${enlace(r.p.link,"Ver")}
          ${r.p.estado !== "aprobado" ? `<button class="ghost small" data-ap="${esc(r.p.id)}">Aprobar</button>` : ""}
          ${r.p.estado !== "devuelto" ? `<button class="ghost small danger" data-dv="${esc(r.p.id)}">Devolver</button>` : ""}` : ""}</td>
      </tr>`).join("")}</table>`
      : `<div class="empty">${todas.length ? "No hay programas con ese filtro." : "Todavía no hay docentes con materias asignadas. Cargalos en la pestaña Docentes."}</div>`}
    </div>`;
  $("#fs").onchange = e => { fcum.sede = e.target.value; panelCumplimiento(); };
  $("#panel").querySelectorAll("[data-k]").forEach(b => b.onclick = () => { fcum.estado = fcum.estado === b.dataset.k ? "" : b.dataset.k; panelCumplimiento(); });
  if ($("#limpiar")) $("#limpiar").onclick = () => { fcum.estado = ""; panelCumplimiento(); };
  $("#panel").querySelectorAll("[data-ap]").forEach(b => b.onclick = async () => {
    await updateDoc(doc(db, "programas", b.dataset.ap), { estado: "aprobado", comentario: "", revisadoPor: me.id, revisadoEn: new Date().toISOString() });
    await cargarDatos(); panelCumplimiento();
  });
  $("#panel").querySelectorAll("[data-dv]").forEach(b => b.onclick = async () => {
    const motivo = prompt("¿Qué tiene que corregir el docente?");
    if (motivo === null) return;
    await updateDoc(doc(db, "programas", b.dataset.dv), { estado: "devuelto", comentario: motivo.trim(), revisadoPor: me.id, revisadoEn: new Date().toISOString() });
    await cargarDatos(); panelCumplimiento();
  });
}

// ---------- Calendario académico ----------
function panelCalendario() {
  const admin = rolDe(eff()) === "admin";
  const misSedes = new Set((eff().asignaciones || []).map(a => a.sedeId));
  const h = hoy();
  let ev = calendario.filter(e =>
    (!fcal.sede || e.sedeId === fcal.sede || e.sedeId === "todas") && (!fcal.tipo || e.tipo === fcal.tipo));
  if (!admin && !fcal.sede && misSedes.size) ev = ev.filter(e => e.sedeId === "todas" || misSedes.has(e.sedeId));
  if (!fcal.pasados) ev = ev.filter(e => (e.fechaFin || e.fecha) >= h);
  const meses = {};
  ev.forEach(e => (meses[e.fecha.slice(0,7)] ||= []).push(e));
  $("#panel").innerHTML = `
    <div class="card">
      <div class="row sp">
        <div class="row">
          <select id="cs"><option value="">${!admin?"Mis sedes":"Todas las sedes"}</option>${sedes.map(s=>`<option value="${s.id}" ${fcal.sede===s.id?"selected":""}>${esc(s.nombre)}</option>`).join("")}</select>
          <select id="ct"><option value="">Todos los tipos</option>${Object.entries(TIPOS).map(([k,[t]])=>`<option value="${k}" ${fcal.tipo===k?"selected":""}>${esc(t)}</option>`).join("")}</select>
          <label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="cp" ${fcal.pasados?"checked":""}> Ver pasados</label>
        </div>
        <div class="row">
          <button class="ghost" id="ics">Sumar a Google Calendar</button>
          ${admin ? `<button class="primary" id="nuevoEv">+ Nuevo evento</button>` : ""}
        </div>
      </div>
    </div>
    <div class="card">
      ${ev.length ? Object.keys(meses).sort().map(k => `
        <div class="mes">${esc(fechaObj(k + "-15").toLocaleDateString("es-AR", { month: "long", year: "numeric" }))}</div>
        ${meses[k].map(e => `
          <div class="ev ${(e.fechaFin||e.fecha) < h ? "pasado" : ""}">
            <span class="dot" style="background:${(TIPOS[e.tipo]||TIPOS.otro)[1]}"></span>
            <div class="fecha">${esc(fmtLarga(e.fecha))}${e.fechaFin && e.fechaFin !== e.fecha ? `<br><span class="muted">al ${esc(fmtLarga(e.fechaFin))}</span>` : ""}</div>
            <div class="cuerpo"><strong>${esc(e.titulo)}</strong><br>
              <span class="tag">${esc((TIPOS[e.tipo]||TIPOS.otro)[0])}</span><span class="tag off">${esc(nSede(e.sedeId))}</span>
              ${e.notas ? `<div class="muted">${esc(e.notas)}</div>` : ""}</div>
            ${admin ? `<div class="row"><button class="ghost small" data-ee="${esc(e.id)}">Editar</button><button class="ghost small danger" data-del="${esc(e.id)}">Borrar</button></div>` : ""}
          </div>`).join("")}`).join("")
      : `<div class="empty">${calendario.length ? "No hay eventos con ese filtro." : (admin ? "Todavía no cargaste eventos. Empezá con el vencimiento de programas: sin esa fecha no se calculan los atrasos." : "Todavía no hay eventos publicados.")}</div>`}
    </div>`;
  $("#cs").onchange = e => { fcal.sede = e.target.value; panelCalendario(); };
  $("#ct").onchange = e => { fcal.tipo = e.target.value; panelCalendario(); };
  $("#cp").onchange = e => { fcal.pasados = e.target.checked; panelCalendario(); };
  $("#ics").onclick = () => descargarIcs(ev);
  if (admin) {
    $("#nuevoEv").onclick = () => modalEvento(null);
    $("#panel").querySelectorAll("[data-ee]").forEach(b => b.onclick = () => modalEvento(calendario.find(e => e.id === b.dataset.ee)));
    $("#panel").querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
      const e = calendario.find(x => x.id === b.dataset.del);
      if (!confirm(`¿Borrar "${e.titulo}"?`)) return;
      await deleteDoc(doc(db, "calendario", e.id)); await cargarDatos(); panelCalendario();
    });
  }
}

function modalEvento(e) {
  const nuevo = !e;
  const bg = abrirModal(`
    <h3>${nuevo ? "Nuevo evento" : "Editar evento"}</h3>
    <label>Título</label><input id="t" style="width:100%" value="${esc(e?.titulo||"")}" placeholder="Ej.: Vencimiento de programas 2027">
    <div class="row"><div style="flex:1"><label>Tipo</label>
      <select id="tp" style="width:100%">${Object.entries(TIPOS).map(([k,[t]])=>`<option value="${k}" ${e?.tipo===k?"selected":""}>${esc(t)}</option>`).join("")}</select></div>
    <div style="flex:1"><label>Sede</label>
      <select id="sd" style="width:100%"><option value="todas">Todas las sedes</option>${sedes.map(s=>`<option value="${s.id}" ${e?.sedeId===s.id?"selected":""}>${esc(s.nombre)}</option>`).join("")}</select></div></div>
    <div class="row"><div style="flex:1"><label>Fecha</label><input id="f" type="date" style="width:100%" value="${esc(e?.fecha||"")}"></div>
    <div style="flex:1"><label>Hasta (opcional)</label><input id="ff" type="date" style="width:100%" value="${esc(e?.fechaFin||"")}"></div></div>
    ${nuevo ? `<label>Repetir cada mes hasta (opcional)</label><input id="rp" type="date" style="width:100%">
      <p class="muted" style="margin:6px 0 0">Útil para el cierre de notas mensual: crea un evento por mes con el mismo día.</p>` : ""}
    <label>Notas (opcional)</label><textarea id="n" rows="2">${esc(e?.notas||"")}</textarea>
    <div id="err" class="msg bad" hidden style="margin-top:10px"></div>
    <div class="row sp" style="margin-top:16px"><button class="ghost" id="cancel">Cancelar</button><button class="primary" id="ok">Guardar</button></div>`);
  $("#cancel", bg).onclick = () => bg.remove();
  $("#ok", bg).onclick = async () => {
    const err = $("#err", bg);
    const base = { titulo: $("#t", bg).value.trim(), tipo: $("#tp", bg).value, sedeId: $("#sd", bg).value,
      fecha: $("#f", bg).value, fechaFin: $("#ff", bg).value || "", notas: $("#n", bg).value.trim() };
    const rp = nuevo ? $("#rp", bg).value : "";
    if (!base.titulo || !base.fecha) { err.hidden = false; err.textContent = "Completá el título y la fecha."; return; }
    if (base.fechaFin && base.fechaFin < base.fecha) { err.hidden = false; err.textContent = "La fecha 'hasta' no puede ser anterior a la fecha de inicio."; return; }
    if (rp && rp < base.fecha) { err.hidden = false; err.textContent = "'Repetir hasta' tiene que ser posterior a la fecha."; return; }
    $("#ok", bg).disabled = true;
    try {
      if (!nuevo) await setDoc(doc(db, "calendario", e.id), base);
      else if (!rp) await setDoc(doc(collection(db, "calendario")), base);
      else {
        const b = writeBatch(db);
        const dur = base.fechaFin ? diffDias(base.fecha, base.fechaFin) : 0;
        for (let i = 0; i < 24; i++) {
          const f = addMes(base.fecha, i);
          if (f > rp) break;
          const ev = { ...base, fecha: f, fechaFin: dur ? (() => { const t = fechaObj(f); t.setDate(t.getDate() + dur); return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`; })() : "" };
          b.set(doc(collection(db, "calendario")), ev);
        }
        await b.commit();
      }
      bg.remove(); await cargarDatos(); panelCalendario();
    } catch (x) { err.hidden = false; err.textContent = "No se pudo guardar: " + (x.code||x.message); $("#ok", bg).disabled = false; }
  };
}

function descargarIcs(lista) {
  if (!lista.length) { alert("No hay eventos para descargar con el filtro actual."); return; }
  const t = s => String(s || "").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
  const d8 = f => f.replace(/-/g, "");
  const sig = f => { const x = fechaObj(f); x.setDate(x.getDate() + 1); return `${x.getFullYear()}${pad(x.getMonth()+1)}${pad(x.getDate())}`; };
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//EBNE Coordinacion//ES","CALSCALE:GREGORIAN","X-WR-CALNAME:Calendario académico EBNE"];
  lista.forEach(e => L.push("BEGIN:VEVENT", `UID:${e.id}@ebne-app`, `DTSTAMP:${stamp}`,
    `DTSTART;VALUE=DATE:${d8(e.fecha)}`, `DTEND;VALUE=DATE:${sig(e.fechaFin || e.fecha)}`,
    `SUMMARY:${t(e.titulo)}`, `DESCRIPTION:${t(`${(TIPOS[e.tipo]||TIPOS.otro)[0]} · ${nSede(e.sedeId)}${e.notas ? " · " + e.notas : ""}`)}`, "END:VEVENT"));
  L.push("END:VCALENDAR");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([L.join("\r\n")], { type: "text/calendar;charset=utf-8" }));
  a.download = "calendario-ebne.ics"; document.body.appendChild(a); a.click(); a.remove();
}

function filaAsig(a = {}) {
  return `<div class="asig">
    <select class="as">${sedes.map(s=>`<option value="${s.id}" ${a.sedeId===s.id?"selected":""}>${esc(s.nombre)}</option>`).join("")}</select>
    <select class="am">${materias.map(m=>`<option value="${m.id}" ${a.materiaId===m.id?"selected":""}>${esc(m.nombre)}</option>`).join("")}</select>
    <button class="ghost danger" type="button" data-x>✕</button></div>`;
}
function modalUsuario(u) {
  const nuevo = !u;
  const bg = abrirModal(`
    <h3>${nuevo ? "Agregar persona" : "Editar persona"}</h3>
    <label>Nombre y apellido</label><input id="n" style="width:100%" value="${esc(u?.nombre||"")}">
    <label>Mail de Google</label><input id="e" type="email" style="width:100%" value="${esc(u?.email||"")}" ${nuevo?"":"disabled"}>
    <div class="row"><div style="flex:1"><label>Rol</label>
      <select id="r" style="width:100%">${[["docente","Docente"],["admin","Administración"]].map(([v,t])=>`<option value="${v}" ${rolDe(u)===v&&u?"selected":""}>${t}</option>`).join("")}</select></div>
    <div style="flex:1"><label>Estado</label>
      <select id="a" style="width:100%"><option value="1">Activo</option><option value="0" ${u?.activo===false?"selected":""}>Inactivo</option></select></div></div>
    <label>Materias y sedes asignadas</label>
    <div id="asigs">${(u?.asignaciones||[]).map(filaAsig).join("")}</div>
    <button class="ghost" type="button" id="mas">+ Agregar materia</button>
    <div id="err" class="msg bad" hidden style="margin-top:10px"></div>
    <div class="row sp" style="margin-top:16px"><button class="ghost" id="cancel">Cancelar</button><button class="primary" id="ok">Guardar</button></div>`);
  const bindX = () => bg.querySelectorAll("[data-x]").forEach(b => b.onclick = () => b.parentElement.remove());
  bindX();
  $("#mas", bg).onclick = () => { $("#asigs", bg).insertAdjacentHTML("beforeend", filaAsig()); bindX(); };

    const email = $("#e", bg).value.trim().toLowerCase(), nombre = $("#n", bg).value.trim();

    const asignaciones = [...bg.querySelectorAll(".asig")].map(r => ({ sedeId: $(".as", r).value, materiaId: $(".am", r).value }))
      .filter((a,i,arr) => arr.findIndex(b => b.sedeId===a.sedeId && b.materiaId===a.materiaId) === i);
    const data = { email, nombre, rol: $("#r", bg).value, activo: $("#a", bg).value === "1", asignaciones };
    $("#ok", bg).disabled = true;
    try { await setDoc(doc(db, "usuarios", email), data, { merge: true }); bg.remove(); await cargarDatos(); vista(); }
    catch (e) { err.hidden = false; err.textContent = "No se pudo guardar: " + (e.code||e.message); $("#ok", bg).disabled = false; }
  };
}
